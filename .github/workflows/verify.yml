name: verify

# 仓库验证：书稿渲染、内部引用、图源、代码片段同步、贯穿项目测试。
# 每个门禁一个 job，PR 上失败位置一目了然（计划 11.4）。
# 外链存活检查为独立定时 workflow（links.yml），不阻断 PR。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  book-structure:
    name: book-structure (book.yml=磁盘=README=outline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python tools/check_book.py

  markdown-render:
    name: markdown-render (无失效加粗)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python tools/check_render.py

  cross-reference-check:
    name: cross-reference-check (章/附录/图号)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_crossrefs.py

  snippet-sync-check:
    name: snippet-sync-check (章节代码=源码)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python examples/reference-assistant/tools/check_snippets.py

  diagram-source-check:
    name: diagram-source-check (D2 已渲染/被引用)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_diagrams.py

  source-freshness:
    name: source-freshness (来源账本/版本一致)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      # CI 非严格：硬失败（缺来源/版本不一致/日期非法）阻断；待确认/过期为告警。
      # 发行前用 tools/check_sources.py --strict 将告警升级为失败。
      - run: python tools/check_sources.py

  mermaid-check:
    name: mermaid-check (1300+ 图可解析)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node tools/check_mermaid.mjs

  contract-tests:
    name: contract-tests (贯穿项目 pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: pip install -e examples/reference-assistant
      - run: python -m pytest -q examples/reference-assistant
